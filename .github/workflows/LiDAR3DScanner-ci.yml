name: LiDAR3DScanner .NET CI

on:
  pull_request:
    branches:
      - main
      - develop
permissions:
  contents: read

concurrency:
  group: winformapp-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, Test, Package
    runs-on: windows-latest
    timeout-minutes: 30
    
    env: 
      PR_TITLE: ${{ github.event.pull_request.title || 'Manual Trigger Testing' }}
      REPO_NAME: ${{ github.repository }}
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   
    steps:
      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4

     # 2. Setup Tools cho .NET Framework 4.8
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3
        
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # (keep .NET SDK 8.0 to setup ReportGenerator Global Tool)
      - name: Setup .NET for Global Tools
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Install ReportGenerator
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      # Add tool path
      - name: Add .NET tools to PATH
        run: echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
        shell: pwsh

      # 3. Restore
      - name: Restore packages
        run: nuget restore ./LiDAR3DScanner.sln

      # Setup Japanese locale
      - name: Setup Japanese Locale
        run: | 
            set LANG=ja_JP.SJIS
            chcp 932
        shell: cmd

      # 4. Build solution by MSBuild to x86
      - name: Build solution
        run: msbuild ./WinFormsApp/WinFormsApp.csproj /p:Configuration=Release /p:Platform=x86 /p:OutputPath=publish
    
            
      # 5. Run coverage script
      - name: Run Coverage Report Script
        run: .\run-coverage-report.bat
        shell: cmd

      # 6. Zip EXE
      - name: Zip WinForms App
        run: |
          Compress-Archive `
          -Path ./WinFormsApp/publish/* `
          -DestinationPath WinFormsApp.zip
        shell: pwsh

      # Zip Coverage Report 
      - name: Zip Coverage Report
        run: |
          if (Test-Path -Path "UnitTests\coverage-report") {
            Compress-Archive -Path UnitTests\coverage-report\* -DestinationPath coverage-report.zip
          } else {
            Write-Host "Coverage report folder not found. Skipping zip."
          }
        shell: pwsh

     # 7. Upload Artifacts
      - name: Upload WinForms App
        uses: actions/upload-artifact@v4
        with:
          name: WinFormsApp
          path: WinFormsApp.zip
      
      # Upload coverage zip
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.zip
  # ==========================================
  # JOB 2: RUN ON LINUX 
  # ==========================================
  upload-drive:
    name: Upload to Drive & Notify
    needs: build-test 
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # 1. Download the App Zip file from the Windows Job to your Linux machine.
      - name: Download App Artifact
        uses: actions/download-artifact@v4
        with:
          name: WinFormsApp

      # 2. Download the Coverage Zip file from the Windows Job (if available).
      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report

      # --- 1. UPLOAD APP TO GOOGLE DRIVE VIA RCLONE ---
      - name: Upload App to Shared Drive
        env:
          GDRIVE_CREDENTIALS_B64: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          RUN_ID: ${{ github.run_id }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          # 1. Get current time (UTC) in yyyyMMdd_HHmm format
          CURRENT_TIME=$(date -u +"%Y%m%d_%Hh%M")
          NEW_APP_FILE="WinFormsApp_${RUN_ID}_${CURRENT_TIME}.zip"
          
          # 2. Save the filename to an environment variable for Google Chat to use later
          echo "APP_FILENAME=$NEW_APP_FILE" >> $GITHUB_ENV
          
          # 3. Decode the Base64 secret
          echo "$GDRIVE_CREDENTIALS_B64" | base64 -d > sa.json
          
          # 4. Install Rclone automatically
          curl -s https://rclone.org/install.sh | sudo bash
          
          # 5. Rename the zip file
          mv WinFormsApp.zip "$NEW_APP_FILE"
          
          # 6. Upload to Google Drive
          export RCLONE_DRIVE_SERVICE_ACCOUNT_FILE=sa.json
          export RCLONE_DRIVE_ROOT_FOLDER_ID=$FOLDER_ID
          rclone copy "$NEW_APP_FILE" :drive: -v

      # --- 2. UPLOAD COVERAGE TO GOOGLE DRIVE VIA RCLONE ---
      - name: Upload Coverage to Shared Drive
        env:
          GDRIVE_CREDENTIALS_B64: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
          FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Check if the file exists before proceeding
          if [ ! -f "coverage-report.zip" ]; then
            echo "Coverage file not found. Skipping upload."
            exit 0
          fi
          
          # 1. Get current time (getting the time again to ensure minute-level accuracy)
          CURRENT_TIME=$(date -u +"%Y%m%d_%Hh%M")
          NEW_COV_FILE="coverage-report_${RUN_ID}_${CURRENT_TIME}.zip"
          
          # 2. Save the filename to an environment variable
          echo "COVERAGE_FILENAME=$NEW_COV_FILE" >> $GITHUB_ENV
          
          # 3. Decode the Base64 secret
          echo "$GDRIVE_CREDENTIALS_B64" | base64 -d > sa.json
          
          # 4. Rename the zip file
          mv coverage-report.zip "$NEW_COV_FILE"
          
          # 5. Upload to Google Drive
          export RCLONE_DRIVE_SERVICE_ACCOUNT_FILE=sa.json
          export RCLONE_DRIVE_ROOT_FOLDER_ID=$FOLDER_ID
          rclone copy "$NEW_COV_FILE" :drive: -v

      # --- 3. SEND GOOGLE CHAT NOTIFICATION ---
      - name: Send Google Chat notification
        shell: pwsh
        env:
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manual Trigger Testing' }}
          PR_URL: ${{ github.event.pull_request.html_url || github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_NAME: ${{ github.repository }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CHAT_WEBHOOK)) {
            Write-Host "GOOGLE_CHAT_WEBHOOK is not configured. Skipping notification."
            exit 0
          }

          $safeTitle = [System.Net.WebUtility]::HtmlEncode($env:PR_TITLE)
          $driveUrl = "https://drive.google.com/drive/folders/$($env:GDRIVE_FOLDER_ID)"
          
          # Handle the case where the coverage file is missing
          $covFileName = if ([string]::IsNullOrWhiteSpace($env:COVERAGE_FILENAME)) { "N/A (No report generated)" } else { $env:COVERAGE_FILENAME }

          $payload = @{
            cardsV2 = @(
              @{
                cardId = 'winformapp-ci'
                card = @{
                  header = @{
                    title = 'WinFormsApp CI completed'
                    subtitle = $env:REPO_NAME
                  }
                  sections = @(
                    @{
                      widgets = @(
                        @{
                          textParagraph = @{
                            # Use the environment variable to correctly display the filename with the timestamp
                            text = "<b>Merged PR:</b> $safeTitle<br><b>App Build:</b> $($env:APP_FILENAME)<br><b>Coverage:</b> $covFileName"
                          }
                        }
                        @{
                          buttonList = @{
                            buttons = @(
                              @{
                                text = '📂 Open Google Drive'
                                onClick = @{ openLink = @{ url = $driveUrl } }
                              }
                              @{
                                text = '⚙️ Open workflow run'
                                onClick = @{ openLink = @{ url = $env:RUN_URL } }
                              }
                            )
                          }
                        }
                      )
                    }
                  )
                }
              }
            )
          } | ConvertTo-Json -Depth 20

          Invoke-RestMethod -Uri $env:GOOGLE_CHAT_WEBHOOK -Method Post -ContentType 'application/json; charset=utf-8' -Body $payload