name: LiDAR3DScanner .NET CI

on:
  pull_request:
    branches:
      - main
      - develop
permissions:
  contents: read

concurrency:
  group: dskview-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, Test, Package
    runs-on: windows-latest
    timeout-minutes: 30
    
    env: 
      PR_TITLE: ${{ github.event.pull_request.title || 'Manual Trigger Testing' }}
      REPO_NAME: ${{ github.repository }}
      WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          # Lấy ID thư mục Drive từ Secrets để tạo link
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
     
      PR_URL: ${{ github.event.pull_request.html_url || github.server_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
     
          # Truyền run_id vào script
      RUN_ID: ${{ github.run_id }}
    steps:
      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4

     # 2. Setup Tools cho .NET Framework 4.8
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3
        
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # (keep .NET SDK 8.0 to setup ReportGenerator Global Tool)
      - name: Setup .NET for Global Tools
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Install ReportGenerator
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      # Add tool path
      - name: Add .NET tools to PATH
        run: echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
        shell: pwsh

      # 3. Restore
      - name: Restore packages
        run: nuget restore ./LiDAR3DScanner.sln

      # Setup Japanese locale
      - name: Setup Japanese Locale
        run: | 
            set LANG=ja_JP.SJIS
            chcp 932
        shell: cmd

      # 4. Build solution by MSBuild to x86
      - name: Build solution
        run: msbuild ./WinFormsApp/WinFormsApp.csproj /p:Configuration=Release /p:Platform=x86 /p:OutputPath=publish
    
            
      # 5. Run coverage script
      - name: Run Coverage Report Script
        run: .\run-coverage-report.bat
        shell: cmd

      # 6. Zip EXE
      - name: Zip WinForms App
        run: |
          Compress-Archive `
          -Path ./WinFormsApp/publish/* `
          -DestinationPath WinFormsApp.zip
        shell: pwsh

      # Zip Coverage Report
      - name: Zip Coverage Report
        run: |
          Compress-Archive `
          -Path UnitTests\coverage-report/* `
          -DestinationPath coverage-report.zip
        shell: pwsh

     # 7. Upload Artifacts
      - name: Upload WinForms App
        uses: actions/upload-artifact@v4
        with:
          name: WinFormsApp
          path: WinFormsApp.zip
      # UPLOAD TO GOOGLE DRIVE
      - name: Upload to Google Drive
        uses: adityak74/google-drive-upload-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
          filename: "WinFormsApp.zip"
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          name: "WinFormsApp_${{ github.run_id }}.zip" 
          overwrite: "true"
      # Upload coverage zip
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.zip

      # --- UPLOAD COVERAGE TO GOOGLE DRIVE ---
      - name: Upload Coverage to Google Drive
        uses: adityak74/google-drive-upload-action@main
       
        continue-on-error: true
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
          filename: "coverage-report.zip"
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          name: "coverage-report_${{ github.run_id }}.zip" 
          overwrite: "true"
      # Upload trx
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/*.trx

      # --- Send Notification to Google Chat ---
      - name: Send Notification to Google Chat
        if: always()       
        shell: bash
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CHAT_WEBHOOK)) {
            Write-Host "GOOGLE_CHAT_WEBHOOK is not configured. Skipping notification."
            exit 0
          }

          $safeTitle = [System.Net.WebUtility]::HtmlEncode($env:PR_TITLE)
          
          # Tạo đường dẫn trỏ thẳng vào thư mục Google Drive
          $driveUrl = "https://drive.google.com/drive/folders/$($env:GDRIVE_FOLDER_ID)"

          $payload = @{
            cardsV2 = @(
              @{
                cardId = 'dskview-ci'
                card = @{
                  header = @{
                    title = 'DSKView CI completed'
                    subtitle = $env:REPO_NAME
                  }
                  sections = @(
                    @{
                      widgets = @(
                        @{
                          textParagraph = @{
                            # Hiển thị thông tin PR và tên 2 file zip trên Drive
                            text = "<b>Merged PR:</b> $safeTitle<br><b>App Build:</b> DSKView_$($env:RUN_ID).zip<br><b>Coverage:</b> coverage-report_$($env:RUN_ID).zip"
                          }
                        }
                        @{
                          buttonList = @{
                            buttons = @(
                              @{
                                # Nút mở thư mục Google Drive chứa file
                                text = '📂 Open Google Drive'
                                onClick = @{
                                  openLink = @{
                                    url = $driveUrl
                                  }
                                }
                              }
                              @{
                                text = '⚙️ Open workflow run'
                                onClick = @{
                                  openLink = @{
                                    url = $env:RUN_URL
                                  }
                                }
                              }
                            )
                          }
                        }
                      )
                    }
                  )
                }
              }
            )
          } | ConvertTo-Json -Depth 20
          
          Invoke-RestMethod -Uri $env:GOOGLE_CHAT_WEBHOOK -Method Post -ContentType 'application/json; charset=utf-8' -Body $payload